name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Install and build
        run: pnpm install && pnpm -r build
      - name: Publish packages that are not on npm
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in email files identity media; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            package_spec="${package_name}@${package_version}"
            if npm view "$package_spec" version >/dev/null 2>&1; then
              echo "skip $package_spec (already on registry)"
            else
              (cd "$package_dir" && npm publish --access public)
            fi
          done
